<!DOCTYPE html>
<html lang="id" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday Sayangku! ✨</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Poppins', sans-serif;
            /* Soft Daylight Aesthetic: Warm Sunset Pink & Gold Gradient */
            background: linear-gradient(135deg, #fce4ec 0%, #ffe0b2 50%, #f8bbd0 100%);
            overflow-x: hidden;
        }

        .font-cursive {
            font-family: 'Dancing Script', cursive;
        }

        /* Floating Hearts Animation Background */
        .heart-particle {
            position: absolute;
            pointer-events: none;
            animation: floatUp 6s linear infinite;
            opacity: 0.7;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(100vh) scale(0.3) rotate(0deg);
                opacity: 0.8;
            }
            100% {
                transform: translateY(-10vh) scale(1.2) rotate(360deg);
                opacity: 0;
            }
        }

        /* Pulsing Glow Animation */
        .pulse-glow {
            animation: pulseGlow 2s infinite alternate;
        }

        @keyframes pulseGlow {
            0% { box-shadow: 0 0 15px rgba(244, 114, 182, 0.4); }
            100% { box-shadow: 0 0 30px rgba(244, 114, 182, 0.8); }
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 relative overflow-hidden py-10">

    <!-- Background Floating Particles Container -->
    <div id="hearts-container" class="fixed inset-0 pointer-events-none z-0"></div>

    <!-- Music Control Player Floating Button -->
    <div class="fixed top-4 right-4 z-50 flex items-center bg-white/80 backdrop-blur-md px-4 py-2 rounded-full shadow-lg border border-amber-200">
        <button id="music-toggle" class="text-amber-600 hover:text-amber-700 focus:outline-none transition-transform active:scale-95 flex items-center gap-2">
            <i id="music-icon" class="fas fa-music text-lg animate-spin" style="animation-duration: 3s;"></i>
            <span id="music-text" class="text-xs font-semibold text-gray-700">Play Music ♫</span>
        </button>
        <!-- Background Music Track: Audio -->
        <audio id="bg-music" loop preload="auto">
            <source src="love.mp3" type="audio/mpeg">
        </audio>
    </div>

    <!-- Main Container Card -->
    <main class="w-full max-w-md z-10 my-auto">
        <!-- Envelope/Message Box Section -->
        <div id="main-card" class="bg-white/85 backdrop-blur-md rounded-3xl p-6 sm:p-8 shadow-2xl border border-amber-100 text-center relative transition-all duration-500 transform">
            
            <!-- Avatar / Cute Birthday Graphic Header -->
            <div class="relative w-28 h-28 mx-auto mb-4">
                <div class="absolute inset-0 bg-pink-400 rounded-full animate-ping opacity-25"></div>
                <img id="header-img" src="Birthday Cake.jpg" 
                     alt="Birthday Cake" 
                     class="w-full h-full object-cover rounded-full border-4 border-white shadow-md relative z-10 transition-all duration-300">
            </div>

            <!-- Header Title -->
            <h1 class="text-3xl font-bold text-gray-800 mb-1 font-cursive tracking-wide">Happy Birthday, Sayangku! 🎉❤️</h1>

            <!-- 3 Photo Gallery Section (Initially hidden or shown during reveal) -->
            <div id="photo-gallery" class="grid grid-cols-3 gap-2 mb-4 hidden">
                <div class="overflow-hidden rounded-2xl shadow-md border-2 border-white transform -rotate-3 hover:rotate-0 transition-transform duration-300">
                    <img src="Foto 1.jpg" alt="Foto 1" class="w-full h-24 object-cover">
                </div>
                <div class="overflow-hidden rounded-2xl shadow-md border-2 border-white transform rotate-2 hover:rotate-0 transition-transform duration-300">
                    <img src="Foto 2.jpg" alt="Foto 2" class="w-full h-24 object-cover">
                </div>
                <div class="overflow-hidden rounded-2xl shadow-md border-2 border-white transform -rotate-2 hover:rotate-0 transition-transform duration-300">
                    <img src="Foto 3.jpg" alt="Foto 3" class="w-full h-24 object-cover">
                </div>
            </div>

            <!-- Dynamic Interactive Content Box -->
            <div id="content-box" class="min-h-[140px] flex items-center justify-center p-4 bg-pink-50/70 rounded-2xl border border-pink-100 mb-6 relative">
                <p id="typewriter-text" class="text-gray-700 text-sm sm:text-base leading-relaxed font-medium">
                    aloo cayang aku kejutan ulang tahun kecill dari aku buat kamuu... Tekan tombol di bawah ya! ✨
                </p>
            </div>

            <!-- Action Buttons Container -->
            <div id="button-section" class="flex flex-col gap-3 items-center justify-center">
                <!-- Open Secret Message Button -->
                <button id="btn-open" onclick="startMessageSequence()" class="w-full py-3 px-6 bg-gradient-to-r from-amber-400 via-pink-400 to-rose-400 text-white font-semibold rounded-full shadow-lg hover:opacity-90 transform active:scale-95 transition-all pulse-glow">
                    Buka Pesan Spesial ✨
                </button>
            </div>

  <!-- Playful "maukaah cayang menuaa samaa akuu???" Question Modal / Layer -->
<div id="question-section" class="hidden flex-col items-center justify-center space-y-3 pt-1 pb-6">
    <p class="text-base font-semibold text-gray-800 text-center px-4">maukaah cayang menuaa samaa akuu??? 🥺✨</p>
    
    <!-- Ubah flex container agar tombolnya berdampingan rapi dan tidak lari keluar kotak -->
    <div class="flex flex-row items-center justify-center gap-3 w-full mt-2 mb-2 px-4" id="dodge-area">
        <!-- Yes Button -->
        <button id="btn-yes" onclick="handleYesClick()" class="py-2 px-5 bg-pink-500 text-white font-bold text-sm rounded-full shadow-md hover:bg-pink-600 transform active:scale-95 transition-all z-20">
            mauu banget, sayang!
        </button>

        <!-- No Button (Sekarang diposisikan berdampingan agar pasti kelihatan) -->
        <button id="btn-no" class="py-2 px-5 bg-gray-400 text-white font-bold text-sm rounded-full shadow-md transition-all duration-200 z-10">
            ndaa maw
        </button>
    </div>
</div>

        </div>
    </main>

    <!-- Success Modal Layer -->
    <div id="success-modal" class="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4 hidden opacity-0 transition-opacity duration-300">
        <div class="bg-white rounded-3xl p-6 sm:p-8 max-w-sm w-full text-center shadow-2xl border border-pink-200 transform scale-95 transition-transform duration-300">
            <div class="text-5xl mb-4 animate-bounce">🎂💖✨</div>
            <h2 class="text-2xl font-bold text-gray-800 font-cursive mb-2">Selamat Ulang Tahun, cintakuu cayangkuu!</h2>
            <p class="text-sm text-gray-600 mb-6">Semoga semua impianmu terwujud. I love you moree moree and moree cayaang! 💕</p>
            <button onclick="resetApp()" class="py-2.5 px-6 bg-amber-500 text-white font-semibold rounded-full hover:bg-amber-600 transition-colors shadow-md">
                Putar Lagi 🔄
            </button>
        </div>
    </div>

    <!-- Application Script Logic -->
    <script>
        // DOM Elements Selection
        const heartsContainer = document.getElementById('hearts-container');
        const bgMusic = document.getElementById('bg-music');
        const musicToggle = document.getElementById('music-toggle');
        const musicIcon = document.getElementById('music-icon');
        const musicText = document.getElementById('music-text');
        const typewriterText = document.getElementById('typewriter-text');
        const btnOpen = document.getElementById('btn-open');
        const questionSection = document.getElementById('question-section');
        const btnNo = document.getElementById('btn-no');
        const dodgeArea = document.getElementById('dodge-area');
        const headerImg = document.getElementById('header-img');
        const successModal = document.getElementById('success-modal');
        const photoGallery = document.getElementById('photo-gallery');

        let isMusicPlaying = false;

        // Personalized Birthday Messages for "Sayangku / Cintaku"
        const loveMessages = [
            "Happy Birthday ya sayangkuu! 🎉 semoga di umur kamu yang sekarang, banyak hal baik yang dateng ke kamu yaa.",
            "thank you for coming into my life, for being part of my days, and for giving me so many little things that mean more to me than you probably realize.",
            "semoga apa yang kamu pengenin satu satu bisa tercapai, semoga kamu selalu sehat, bahagia.",
            "ini ada 3 foto favoritku saat sama kamuu... i love you sayangg",
            "satu hal terakhir yang mau aku tanyain..."
        ];

        let messageIndex = 0;

        // Floating Hearts Generator
        function createHeart() {
            const heart = document.createElement('div');
            heart.classList.add('heart-particle');
            
            const heartIcons = ['💖', '☀️', '✨', '🌸', '💕'];
            heart.innerText = heartIcons[Math.floor(Math.random() * heartIcons.length)];
            
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.fontSize = (Math.random() * 20 + 15) + 'px';
            heart.style.animationDuration = (Math.random() * 4 + 4) + 's';

            heartsContainer.appendChild(heart);

            setTimeout(() => {
                heart.remove();
            }, 8000);
        }

        setInterval(createHeart, 400);

        // Music Controls
        function toggleMusic() {
            if (isMusicPlaying) {
                bgMusic.pause();
                musicIcon.classList.remove('fa-spin');
                musicText.innerText = "Play Daylight ♫";
            } else {
                bgMusic.play().then(() => {
                    musicIcon.classList.add('fa-spin');
                    musicText.innerText = "Playing ♪";
                }).catch(err => {
                    console.log("Audio playback error: ", err);
                });
            }
            isMusicPlaying = !isMusicPlaying;
        }

        musicToggle.addEventListener('click', toggleMusic);

        // Typewriter Effect Logic
        function typeWriter(text, i = 0, callback) {
            if (i < text.length) {
                typewriterText.innerHTML = text.substring(0, i + 1) + '<span class="animate-pulse">|</span>';
                setTimeout(() => typeWriter(text, i + 1, callback), 40);
            } else {
                typewriterText.innerHTML = text;
                if (callback) setTimeout(callback, 1400);
            }
        }

        // Sequence Handler
        function startMessageSequence() {
            if (!isMusicPlaying) {
                toggleMusic();
            }

            btnOpen.classList.add('hidden');
            
            // Show photo gallery when sequence reaches photo message
            playNextMessage();
        }

        function playNextMessage() {
            if (messageIndex === 3) {
                photoGallery.classList.remove('hidden');
            }

            if (messageIndex < loveMessages.length) {
                typeWriter(loveMessages[messageIndex], 0, () => {
                    messageIndex++;
                    if (messageIndex < loveMessages.length) {
                        playNextMessage();
                    } else {
                        questionSection.classList.remove('hidden');
                        questionSection.classList.add('flex');
                    }
                });
            }
        }

        // Playful Dodge "No" Button
        function moveNoButton() {
            const containerRect = dodgeArea.getBoundingClientRect();
            const btnRect = btnNo.getBoundingClientRect();

            const maxW = containerRect.width - btnRect.width;
            const maxH = 120;

            const randomX = Math.floor(Math.random() * maxW) - (maxW / 2);
            const randomY = Math.floor(Math.random() * maxH) - (maxH / 2);

            btnNo.style.transform = `translate(${randomX}px, ${randomY}px)`;
        }

        btnNo.addEventListener('mouseenter', moveNoButton);
        btnNo.addEventListener('touchstart', (e) => {
            e.preventDefault();
            moveNoButton();
        });

        // "Yes" Selection
        function handleYesClick() {
            for(let i=0; i<35; i++) {
                setTimeout(createHeart, i * 40);
            }

            successModal.classList.remove('hidden');
            setTimeout(() => {
                successModal.classList.remove('opacity-0');
                successModal.children[0].classList.remove('scale-95');
                successModal.children[0].classList.add('scale-100');
            }, 50);
        }

        // Reset App
        function resetApp() {
            messageIndex = 0;
            questionSection.classList.add('hidden');
            questionSection.classList.remove('flex');
            photoGallery.classList.add('hidden');
            btnOpen.classList.remove('hidden');
            typewriterText.innerText = "ada kejutan keciill dari aku untuk kamuu... Tekan tombol di bawah ya! ✨";
            btnNo.style.transform = "none";
            
            successModal.classList.add('opacity-0');
            setTimeout(() => {
                successModal.classList.add('hidden');
            }, 300);
        }
    </script>
</body>
</html>
